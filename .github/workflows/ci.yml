name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tool/AI

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Tool/AI/package-lock.json

      - name: Install backend dependencies
        run: npm install

      - name: Check server syntax
        run: node --check src/server.js

      - name: Verify config loads
        run: node -e "require('./src/config')"

      - name: Verify contract parsing loads
        run: node -e "const {parseContract} = require('./src/contracts/contractParser'); console.log('Contract parsing OK')"

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Tool/AI/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: Tool/AI/frontend

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: Tool/AI/frontend

      - name: Build frontend
        run: npm run build
        working-directory: Tool/AI/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: Tool/AI/frontend